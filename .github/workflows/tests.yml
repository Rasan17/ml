# Runs the automated checks on every push and pull request, and fails the build if any check fails.
# The full PyTorch / imbalanced-learn benchmark (tests/benchmark_vs_python.py) is not run here because of
# its size; run it locally before releases.
name: tests

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python reference libraries
        run: pip install numpy scipy scikit-learn statsmodels

      - name: Fallback bundle and import-map versions are up to date with src/
        run: |
          node tools/build.js
          git diff --exit-code dist/app.bundle.js index.html

      - name: Edge cases (data engine and models)
        run: node tests/edge_cases.js

      - name: End-to-end workflow checks
        run: node tests/end_to_end.js

      - name: Reference checks against SciPy / scikit-learn / statsmodels
        run: |
          node tests/reference_check.js
          python tests/reference_check.py

      - name: Neural-network forward pass recomputed in NumPy
        run: python tests/nn_forward_check.py

  ui:
    # Browser smoke tests of the interface (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test
      - name: Keep the test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
