# Runs the R cross-check scripts generated by the app (logistic regression with Options A and C, linear regression,
# a Cox model and a competing-risk model) in R, and fails if the app's and R's results disagree beyond the
# tolerances in tests/ui/r-crosscheck.spec.js. Separate from the main tests because installing R takes a few minutes.
name: r-crosscheck

on:
  push:
  workflow_dispatch:

jobs:
  r-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install the R packages used by the cross-check scripts
        run: Rscript -e 'install.packages(c("survival", "pROC", "rms", "riskRegression", "prodlim", "mice"))'
      - name: Install Playwright (Chromium)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate the scripts in the app and run them in R
        run: npx playwright test tests/ui/r-crosscheck.spec.js --project=chromium
